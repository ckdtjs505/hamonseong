<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 청소년부 성경 읽기</title>
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin Dashboard Specific Styles */
    body { background-color: var(--bg-subtle); }
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    .admin-sidebar {
      width: 250px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .admin-sidebar h2 {
      font-size: 1.25rem;
      color: var(--text-main);
      margin-bottom: 1rem;
      padding-left: 0.5rem;
    }
    .admin-nav-item {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }
    .admin-nav-item:hover, .admin-nav-item.active {
      background-color: var(--accent-light);
      color: var(--accent-primary);
    }
    .admin-main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .admin-header h1 {
      font-size: 1.75rem;
      color: var(--text-main);
    }
    .admin-card {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .admin-table th, .admin-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-table th {
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
    }
    .admin-table tr:hover {
      background-color: var(--bg-subtle);
    }
    .admin-btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }
    .admin-btn-primary {
      background-color: var(--accent-primary);
      color: white;
    }
    .admin-btn-primary:hover {
      background-color: var(--accent-hover);
    }
    .admin-btn-danger {
      background-color: #ef4444;
      color: white;
    }
    .admin-btn-danger:hover {
      background-color: #dc2626;
    }
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-admin { background-color: #fef08a; color: #854d0e; }
    .badge-member { background-color: #e2e8f0; color: #475569; }
  </style>
</head>

<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2>⚙️ 관리자 대시보드</h2>
      <button class="admin-nav-item active" data-target="users">사용자 관리</button>
      <button class="admin-nav-item" data-target="logs">함온성 기록 관리</button>
      <button class="admin-nav-item" data-target="plans">계획 관리</button>
      <div style="flex-grow: 1;"></div>
      <button class="admin-nav-item" onclick="window.location.href='index.html'">돌아가기</button>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 id="pageTitle">사용자 관리</h1>
        <div id="adminUserArea">
          <!-- User info -->
        </div>
      </header>

      <!-- Users Section -->
      <section id="usersSection" class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>전체 사용자</h3>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>이름</th>
                <th>아이디(Username)</th>
                <th>권한</th>
                <th>가입일</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Logs Section -->
      <section id="logsSection" class="admin-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>전체 함온성 기록</h3>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>날짜</th>
                <th>작성자</th>
                <th>회차</th>
                <th>선택구절/기도</th>
                <th>작성일시</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Plans Section -->
      <section id="plansSection" class="admin-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>성경 읽기 계획 관리</h3>
          <button class="admin-btn admin-btn-primary" onclick="openPlanModal()">+ 새 계획 추가</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>날짜</th>
                <th>성경 번호 (Book ID)</th>
                <th>시작 장</th>
                <th>끝 장</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="plansTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Plan Modal -->
  <div id="planModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="admin-card" style="width: 400px; max-width: 90%;">
      <h3 id="planModalTitle" style="margin-bottom: 1rem;">새 계획 추가</h3>
      <form id="planForm">
        <input type="hidden" id="planId">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem;">날짜</label>
          <input type="date" id="planDate" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem;">성경 권 (Book ID: 1~66)</label>
          <input type="number" id="planBook" min="1" max="66" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          <small style="color: var(--text-muted); display: block; margin-top: 4px;">* 창세기=1, 출애굽기=2, ... 마태복음=40 등</small>
        </div>
        <div style="margin-bottom: 1rem; display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 0.5rem;">시작 장</label>
            <input type="number" id="planStart" min="1" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          </div>
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 0.5rem;">끝 장</label>
            <input type="number" id="planEnd" min="1" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
          <button type="button" class="admin-btn" onclick="closePlanModal()" style="background-color: var(--bg-subtle);">취소</button>
          <button type="submit" class="admin-btn admin-btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/core/constants.js"></script>
  <script src="js/admin_app.js"></script>
</body>

</html>
