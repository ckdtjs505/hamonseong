<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 청소년부 성경 읽기</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">

</head>

<body>
  <div class="admin-layout">
    <!-- ===== 좌측 사이드바 네비게이션 ===== -->
    <!-- data-target 속성: main.js에서 해당 값으로 섹션을 찾아 표시/숨김 처리 -->
    <aside class="admin-sidebar">
      <h2>⚙️ 관리자 대시보드</h2>
      <button class="admin-nav-item" data-target="users">사용자 관리</button>
      <button class="admin-nav-item" data-target="progress">반별 진행사항 관리</button> <!-- 반별 O/X 진행사항 -->
      <button class="admin-nav-item" data-target="logs">함온성 기록 관리</button>
      <button class="admin-nav-item" data-target="plans">함온성 계획 관리</button>
      <div style="flex-grow: 1;"></div>
      <button class="admin-nav-item" onclick="window.location.href='../index.html'">돌아가기</button>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 id="pageTitle">사용자 관리</h1>
        <div id="adminUserArea">
          <!-- User info -->
        </div>
      </header>

      <!-- Users Section -->
      <section id="usersSection" class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>전체 사용자</h3>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>이름</th>
                <th>반(Class)</th>
                <th>아이디(Username)</th>
                <th>권한</th>
                <th>가입일</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- ===== 반별 진행사항 섹션 (Progress Section) ===== -->
      <!-- progress.js에서 loadProgress() 호출 시 데이터를 불러와 렌더링 -->
      <!-- 읽기 계획(read_plan)의 전체 일정을 열로, 학생을 행으로 배치하여 O/X 표시 -->
      <section id="progressSection" class="admin-card" style="display: none;">
        <!-- 상단: 제목 + 이름 검색 입력창 -->
        <div
          style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
          <h3>반별 진행사항</h3>
          <div style="display: flex; gap: 10px; align-items: center;">
            <!-- 이름 검색: 입력 시 실시간으로 테이블 필터링 (progress.js에서 input 이벤트 처리) -->
            <input type="text" id="progressSearchInput" placeholder="이름 검색..."
              style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          </div>
        </div>
        <!-- 반별 필터 버튼 영역: progress.js의 renderClassFilters()가 동적으로 버튼 생성 -->
        <div id="classFilterContainer" style="margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <!-- JS가 전체/미지정/1반/2반 등의 필터 버튼을 동적으로 삽입 -->
        </div>
        <!-- 진행사항 O/X 테이블 (가로 스크롤 가능) -->
        <div style="overflow-x: auto; background-color: var(--bg-card); border-radius: 8px;">
          <table class="admin-table" id="progressTable" style="text-align: center; white-space: nowrap;">
            <thead id="progressTableHead">
              <!-- progress.js가 계획(Day) 날짜를 열 헤더로 삽입 -->
            </thead>
            <tbody id="progressTableBody">
              <!-- progress.js가 사용자별 O/X 행을 삽입 -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Logs Section -->
      <section id="logsSection" class="admin-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>전체 함온성 기록</h3>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>날짜</th>
                <th>작성자</th>
                <th>회차</th>
                <th>선택구절/기도</th>
                <th>작성일시</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Plans Section -->
      <section id="plansSection" class="admin-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3>함온성 계획 (read_plan) 관리</h3>
          <button class="admin-btn admin-btn-primary" onclick="openPlanModal()">+ 새 계획 추가</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th onclick="sortPlans('daycount')" style="cursor: pointer;" title="클릭하여 정렬">일차(Day) ↕️</th>
                <th onclick="sortPlans('date')" style="cursor: pointer;" title="클릭하여 정렬">날짜 ↕️</th>
                <th onclick="sortPlans('book')" style="cursor: pointer;" title="클릭하여 정렬">성경 권 (Book) ↕️</th>
                <th onclick="sortPlans('start')" style="cursor: pointer;" title="클릭하여 정렬">시작 장 ↕️</th>
                <th onclick="sortPlans('end')" style="cursor: pointer;" title="클릭하여 정렬">끝 장 ↕️</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="plansTableBody">
              <!-- JS will populate this -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Plan Modal -->
  <div id="planModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="admin-card" style="width: 400px; max-width: 90%;">
      <h3 id="planModalTitle" style="margin-bottom: 1rem;">새 계획 추가</h3>
      <form id="planForm">
        <input type="hidden" id="planId">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem;">일차 (Daycount)</label>
          <input type="number" id="planDaycount" required
            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem;">날짜</label>
          <input type="date" id="planDate" required
            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem;">성경 권 (예: 창세기, 1 등)</label>
          <input type="text" id="planBook" required
            style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          <small style="color: var(--text-muted); display: block; margin-top: 4px;">* '창세기'와 같은 이름이나 숫자 ID를 입력할 수
            있습니다.</small>
        </div>
        <div style="margin-bottom: 1rem; display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 0.5rem;">시작 장</label>
            <input type="number" id="planStart" min="1" required
              style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          </div>
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 0.5rem;">끝 장</label>
            <input type="number" id="planEnd" min="1" required
              style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
          <button type="button" class="admin-btn" onclick="closePlanModal()"
            style="background-color: var(--bg-subtle);">취소</button>
          <button type="submit" class="admin-btn admin-btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Log Detail Modal -->
  <div id="logDetailModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="admin-card" style="width: 500px; max-width: 90%; max-height: 80vh; display: flex; flex-direction: column;">
      <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">함온성 기록 상세</h3>
      <div style="flex: 1; overflow-y: auto; margin-bottom: 1rem; padding-right: 0.5rem; line-height: 1.6;">
        <div style="margin-bottom: 1rem;">
          <h4 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.25rem;">선택 구절 (말씀)</h4>
          <p id="logDetailMsg" style="background: var(--bg-primary); padding: 1rem; border-radius: 8px; font-size: 0.95rem; white-space: pre-wrap; word-break: break-all;"></p>
        </div>
        <div>
          <h4 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.25rem;">기도 제목</h4>
          <p id="logDetailPray" style="background: var(--bg-primary); padding: 1rem; border-radius: 8px; font-size: 0.95rem; white-space: pre-wrap; word-break: break-all;"></p>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" class="admin-btn" onclick="closeLogDetailModal()"
          style="background-color: var(--bg-subtle);">닫기</button>
      </div>
    </div>
  </div>

  <!-- ===== JavaScript 로드 순서 ===== -->
  <!-- 1. constants.js: API_BASE_URL 등 전역 상수 정의 -->
  <!-- 2. 각 탭별 기능 스크립트 (users, progress, logs, plans) -->
  <!-- 3. main.js: 페이지 초기화 및 탭 전환 제어 (모든 기능 스크립트 로드 후 실행) -->
  <script src="../js/core/constants.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/admin/users.js"></script>
  <script src="../js/admin/progress.js"></script>
  <script src="../js/admin/logs.js"></script>
  <script src="../js/admin/plans.js"></script>
  <script src="../js/admin/main.js"></script>
</body>

</html>
