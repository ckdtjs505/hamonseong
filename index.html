<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소년부 성경 읽기 - 매일 말씀 묵상</title>
  <meta name="description" content="청소년부 성경 읽기표 및 매일 말씀 묵상 웹 애플리케이션입니다.">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-container">

    <!-- 1. Header & Controls -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">✝</div>
        <div class="brand-title">
          <h1>청소년부 성경 읽기</h1>
          <p>매일 말씀으로 삶을 채우는 시간</p>
        </div>
      </div>

      <div class="header-controls">
        <!-- User Auth Area -->
        <div class="user-auth-control">
          <button id="loginOpenBtn" class="btn-auth btn-login">로그인</button>
          <div id="userProfileArea" class="user-profile-area" style="display: none;">
            <span id="userNameSpan" class="user-name"></span>
            <button id="logoutBtn" class="btn-auth btn-logout">로그아웃</button>
          </div>
        </div>

        <!-- Font Size Adjuster -->
        <div class="control-group" title="글자 크기 조절">
          <button id="fontDecreaseBtn" class="btn-icon" aria-label="글자 크기 축소">A-</button>
          <button id="fontIncreaseBtn" class="btn-icon" aria-label="글자 크기 확대">A+</button>
        </div>

        <!-- Theme Selector -->
        <select id="themeSelect" class="theme-select" aria-label="테마 선택">
          <option value="light">☀️ 라이트 모드</option>
          <option value="dark">🌙 다크 모드</option>
          <option value="paper">📜 페이퍼 모드</option>
        </select>
      </div>
    </header>

    <!-- 2. Date Navigation Bar -->
    <nav class="date-nav-card">
      <div class="date-controls">
        <button id="prevDateBtn" class="btn-nav" aria-label="이전 날짜">
          <span>‹</span> 이전
        </button>

        <div class="date-picker-wrapper">
          <input type="date" id="dateInput" aria-label="날짜 선택">
        </div>

        <button id="todayBtn" class="btn-nav today-btn" aria-label="오늘 날짜">
          오늘
        </button>

        <button id="nextDateBtn" class="btn-nav" aria-label="다음 날짜">
          다음 <span>›</span>
        </button>
      </div>

      <div id="dateDisplayText" class="date-display-text"></div>
    </nav>

    <!-- 3. Reading Plan Summary Card -->
    <section id="planSummaryCard" class="plan-summary-card" style="display: none;">
      <div class="plan-summary-header">
        <span class="plan-badge">오늘의 말씀 범위</span>
      </div>
      <div id="planTitle" class="plan-title"></div>
      <div id="planRangeList" class="plan-range-list"></div>
    </section>

    <!-- 4. Scripture Reading Main Content -->
    <main id="readingContainer" class="reading-container">
      <!-- Verses will be dynamically rendered here via JavaScript -->
    </main>

    <!-- 5. Toast Notification -->
    <div id="toast" class="toast">구절이 복사되었습니다.</div>

    <!-- 6. Footer -->
    <footer class="app-footer">
      <p>© 2026 청소년부 성경 읽기 (Youth Bible Reading) | All rights reserved.</p>
    </footer>

  </div>

  <!-- 7. Auth Modal (Login / Register) -->
  <div id="authModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close-btn" aria-label="닫기">✕</button>

      <!-- Modal Nav Tabs -->
      <div class="modal-tabs">
        <button id="tabLoginBtn" class="tab-btn active">로그인</button>
        <button id="tabRegisterBtn" class="tab-btn">회원가입</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginUsername">아이디</label>
          <input type="text" id="loginUsername" placeholder="아이디를 입력하세요" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
        </div>
        <div id="loginErrorMsg" class="error-msg" style="display: none;"></div>
        <button type="submit" class="btn-submit">로그인</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="registerName">이름 (학생/선생님)</label>
          <input type="text" id="registerName" placeholder="실명을 입력하세요 (예: 홍길동)" required>
        </div>
        <div class="form-group">
          <label for="registerUsername">아이디</label>
          <input type="text" id="registerUsername" placeholder="사용할 아이디 (3자 이상)" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="registerPassword">비밀번호</label>
          <input type="password" id="registerPassword" placeholder="비밀번호 (4자 이상)" required autocomplete="new-password">
        </div>
        <div id="registerErrorMsg" class="error-msg" style="display: none;"></div>
        <button type="submit" class="btn-submit">회원가입 완료</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
</body>

</html>
